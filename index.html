<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Outils</title>
<style>
  :root{--bg:#0f1420;--card:#1a2233;--line:#2a3550;--ink:#eaf0fb;--muted:#94a2bd}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1000px 500px at 50% -200px,rgba(109,134,240,.25),transparent),var(--bg);
    color:var(--ink);min-height:100vh;padding:34px 18px 40px}
  .wrap{max-width:760px;margin:0 auto}
  header{text-align:center;margin-bottom:32px}
  header h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.5px}
  header p{color:var(--muted);font-size:14px;margin:8px 0 0}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
  .tile{position:relative;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:22px;
    text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:18px;text-align:center;transition:transform .12s,box-shadow .12s,border-color .12s;overflow:hidden}
  .tile:before{content:"";position:absolute;inset:0;background:var(--glow);opacity:.16}
  .tile:active{transform:scale(.97)}
  @media(hover:hover){.tile:hover{transform:translateY(-4px);border-color:transparent;box-shadow:0 12px 30px rgba(0,0,0,.35)}}
  .ico{font-size:44px;position:relative;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
  .nm{position:relative;font-weight:700;font-size:16px;margin-top:12px;line-height:1.2}
  .ds{position:relative;color:var(--muted);font-size:12px;margin-top:5px;line-height:1.35}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧰 Mes Outils</h1>
    <p>Toutes mes applications au même endroit</p>
  </header>
  <div class="grid">
    <a class="tile" style="--glow:radial-gradient(circle at 50% 30%,#22c55e,transparent 70%)" href="https://w3ruslan.github.io/suivi-heures/">
      <div class="ico">⏱️</div><div class="nm">Suivi des Heures</div><div class="ds">Heures des employés</div>
    </a>
    <a class="tile" style="--glow:radial-gradient(circle at 50% 30%,#f59e0b,transparent 70%)" href="https://w3ruslan.github.io/suivi-pains/">
      <div class="ico">🥖</div><div class="nm">Suivi des Pains</div><div class="ds">Comptage boulangerie</div>
    </a>
    <a class="tile" style="--glow:radial-gradient(circle at 50% 30%,#ef4444,transparent 70%)" href="https://w3ruslan.github.io/etiket/">
      <div class="ico">🏷️</div><div class="nm">Étiquettes</div><div class="ds">Prix à imprimer</div>
    </a>
    <a class="tile" style="--glow:radial-gradient(circle at 50% 30%,#6d86f0,transparent 70%)" href="https://w3ruslan.github.io/suivi-paris/">
      <div class="ico">⚽</div><div class="nm">Paris Sport</div><div class="ds">Stratégie match nul</div>
    </a>
  </div>
  <footer>w3ruslan · GitHub Pages</footer>
</div>
</body>
</html>
